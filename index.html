<!doctype html>
<html lang="zh-CN"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1,viewport-fit=cover"><meta name="theme-color" content="#111827"><title>12周举重训练计划</title><style>:root{--bg:#f6f7fb;--card:#fff;--text:#111827;--muted:#6b7280;--line:#e5e7eb;--good:#166534;--goodbg:#dcfce7}*{box-sizing:border-box}body{margin:0;font-family:-apple-system,BlinkMacSystemFont,"Segoe UI",sans-serif;background:var(--bg);color:var(--text)}header{padding:18px 16px 10px;border-bottom:1px solid var(--line)}h1{font-size:22px;margin:0 0 6px}.sub,.small{font-size:12px;color:var(--muted)}.wrap{max-width:760px;margin:auto;padding:14px 14px 90px}.card{background:#fff;border:1px solid var(--line);border-radius:18px;padding:14px;margin-bottom:12px}.row,.weektitle{display:flex;gap:10px;align-items:center;justify-content:space-between}.grid{display:grid;grid-template-columns:repeat(2,minmax(0,1fr));gap:10px;margin-top:10px}label{display:block;font-size:12px;color:var(--muted);margin-bottom:5px}input,select{width:100%;border:1px solid var(--line);border-radius:10px;padding:10px;font-size:16px;background:#fff}button{border:0;border-radius:12px;padding:10px 12px;background:#fff;box-shadow:0 1px 2px rgba(0,0,0,.05);font-size:14px}.primary{background:#111827;color:#fff}.toolbar{display:flex;gap:8px;overflow:auto;padding:4px 0 12px}.toolbar button.active{background:#111827;color:#fff}.tabdate{display:block;font-size:10px;opacity:.75}.exercise{display:grid;grid-template-columns:30px 1fr;gap:8px;padding:10px 0;border-bottom:1px dashed #eee}.exercise:last-child{border-bottom:0}.exercise input[type=checkbox]{width:22px;height:22px}.done{background:var(--goodbg)}.done .name{text-decoration:line-through;color:var(--good)}.name{font-weight:650}.rx{font-size:14px;color:#374151;margin-top:2px}.fields{display:grid;grid-template-columns:1fr 80px 1fr;gap:8px;margin-top:8px}.tag{display:inline-block;font-size:11px;font-weight:700;padding:4px 7px;border-radius:999px;background:#f3f4f6;margin-top:10px}.choice{padding:10px;border:1px solid var(--line);border-radius:12px;background:#fafafa;margin:8px 0}.daydate{font-size:12px;color:var(--muted);font-weight:500;margin-left:6px}.progress{height:9px;background:#e5e7eb;border-radius:999px;overflow:hidden;margin-top:8px}.progress div{height:100%;background:#111827}.footer{position:fixed;bottom:0;left:0;right:0;padding:10px 14px;background:rgba(255,255,255,.95);border-top:1px solid var(--line)}.footer .row{max-width:760px;margin:auto}.footer button{flex:1}@media(min-width:640px){.grid{grid-template-columns:repeat(4,minmax(0,1fr))}}@media(max-width:520px){.fields{grid-template-columns:1fr 70px}.fields input:last-child{grid-column:1/-1}}</style></head><body><header><h1>12周举重专项深蹲 + 抓挺</h1><div class="sub" id="summary"></div></header><div class="wrap"><div class="card"><div class="weektitle"><div><b>训练 Max</b><div class="small">改完后应用，新 12 周计划自动重算。</div></div><span class="small">Auto</span></div><div class="grid"><div><label>Back Squat Max</label><input id="bs" type="number" step="0.5"></div><div><label>Front Squat Max</label><input id="fs" type="number" step="0.5"></div><div><label>Snatch Max</label><input id="sn" type="number" step="0.5"></div><div><label>Clean & Jerk Max</label><input id="cj" type="number" step="0.5"></div></div><div class="row" style="margin-top:10px"><button class="primary" id="applyMax">应用新 Max</button><button id="defaults">恢复默认</button></div></div><div class="card"><div class="weektitle"><div><b>周期日期</b><div class="small">选择 Week 1 的周一；W1–W12 自动显示日期。</div></div><span class="small">Calendar</span></div><div class="row" style="margin-top:10px"><div style="flex:1"><label>Week 1 周一</label><input id="start" type="date"></div><button class="primary" id="applyDate">应用日期</button></div><div class="small" id="dateHint" style="margin-top:8px"></div></div><div class="toolbar" id="tabs"></div><div class="card"><div class="weektitle"><div><b id="weekTitle"></b><div class="small" id="phase"></div></div><span class="small" id="pct"></span></div><div class="progress"><div id="bar"></div></div></div><div id="content"></div><div class="card"><b>周期规则</b><ul><li>周一重后蹲为第一优先，周五重前蹲为第二优先。</li><li>暂停后蹲是辅助，不做成第二个重后蹲日。</li><li>周二/周四主项：抓举 / 挺举二选一；拉：宽拉 / 窄拉二选一。</li><li>周二以速度、位置、0 miss 为主；周四可以重，但不强制 max。</li><li>Heavy single 控制 RPE 8–9，不做极限 grind。</li></ul></div></div><div class="footer"><div class="row"><button id="home">本周</button><button class="primary" id="export">导出记录</button><button id="reset">重置本周</button></div></div><script>
const P=[
['积累',[82.5,'5×4',70,'4×3'],[77.5,'4×4',72.5,'5×3'],['65–70% ×5×2','65–70% ×4×1–2'],['75–80% ×4–5 singles','75–80% ×4 singles']],
['积累',[85,'5×4',72.5,'3×4'],[82.5,'5×3',75,'3×5'],['68–72% ×5×2','68–72% ×4×1–2'],['80–83% ×4 singles','80–83% ×4 singles']],
['积累',[87.5,'5×4',75,'3×4'],[85,'5×3',77.5,'3×5'],['70–75% ×5×2','70–75% ×4×1–2'],['82–85% ×4 singles','82–85% ×4 singles']],
['Deload',[77.5,'3×3',65,'2×3'],[72.5,'3×3',67.5,'2×4'],['60–65% ×4×2','60–65% ×3–4 singles'],['65–70% ×3 singles','65–70% ×3 singles']],
['力量',[90,'5×3',77.5,'3×3'],[85,'4×3',80,'3×4'],['72–75% ×5×2','72–75% ×4 singles'],['85% ×3–4 singles','85% ×3 singles']],
['力量',[92.5,'5×3',80,'3×3'],[87.5,'4×3',82.5,'3×4'],['75–78% ×4×2','75–80% ×4 singles'],['87–88% ×3 singles','87–88% ×3 singles']],
['力量',['100–102.5','1 + 92.5–95 3×3',80,'3×3'],[90,'4×2',85,'3×4'],['78–82% ×4×1–2','78–82% ×4 singles'],['88–90% ×2–3 singles','88–90% ×2–3 singles']],
['Deload',[80,'3×3',67.5,'2×3'],[75,'3×3',70,'2×4'],['60–70% ×3–4×1–2','60–70% ×3 singles'],['65–70% ×3 singles','65–70% ×3 singles']],
['强化',[105,'1 + 95 3×2',82.5,'3×2'],[90,'3×2',82.5,'3×3'],['75–80% ×4 singles','75–80% ×4 singles'],['90–92% ×2–3 singles','90–92% ×2–3 singles']],
['强化',[107.5,'1 + 97.5 3×2',85,'3×2'],[92.5,'3×2',85,'3×3'],['75–80% ×3–4 singles','75–80% ×3–4 singles'],['92–94% ×1–2 singles','92–94% ×1–2 singles']],
['峰值',[110,'1 + 97.5–100 2×2',87.5,'2×2'],[95,'1 + 90 2×2',85,'2×3'],['70–75% ×3–4 singles','70–75% ×3 singles'],['90–95% ×1–2 singles','90–95% ×1–2 singles']],
['Test',['PR Test','117.5 → 120 → 122.5 可选','',''],['70–75','2×2','','不做'],['60–70% ×3 singles','60–70% ×2–3 singles'],['70→80→87→92→95→PR','70→80→87→92→95→PR']]
];
let max={bs:+localStorage.wl_max_bs||112,fs:+localStorage.wl_max_fs||100,sn:+localStorage.wl_max_sn||0,cj:+localStorage.wl_max_cj||0},week=+localStorage.wl_current_week||1,start=localStorage.wl_program_start||'';const $=id=>document.getElementById(id),r25=x=>Math.round(x/2.5)*2.5,save=(k,v)=>localStorage.setItem(k,v),load=k=>localStorage.getItem(k)||'';
function date(s){let m=/^(\d{4})-(\d{2})-(\d{2})$/.exec(s);return m?new Date(Date.UTC(+m[1],+m[2]-1,+m[3])):null}function add(d,n){let x=new Date(d);x.setUTCDate(x.getUTCDate()+n);return x}function fd(d,y=false){if(!d)return'';return y?`${d.getUTCFullYear()}年${d.getUTCMonth()+1}月${d.getUTCDate()}日`:`${d.getUTCMonth()+1}/${d.getUTCDate()}`}function ws(w){let d=date(start);return d?add(d,(w-1)*7):null}function wr(w){let d=ws(w);return d?`${fd(d)}–${fd(add(d,6))}`:''}function td(w,n){let d=ws(w),o={'周一':0,'周二':1,'周四':3,'周五':4};return d?add(d,o[n]):null}
function scale(v,type){if(typeof v!=='number')return v;return r25(v*max[type]/(type==='bs'?112:100))}function calcPct(t,type){let m=t.match(/(\d+(?:\.\d+)?)(?:–(\d+(?:\.\d+)?))?%/),mx=max[type];if(!m||!mx)return'';let a=r25(mx*+m[1]/100),b=r25(mx*+(m[2]||m[1])/100);return a===b?`≈ ${a} kg`:`≈ ${a}–${b} kg`}
function init(){['bs','fs','sn','cj'].forEach(k=>$(k).value=max[k]||'');$('start').value=start;summary();render()}function summary(){$('summary').textContent=`BS ${max.bs} kg · FS ${max.fs} kg${max.sn?` · Snatch ${max.sn} kg`:''}${max.cj?` · C&J ${max.cj} kg`:''}`;$('dateHint').textContent=start?`Week 1：${fd(ws(1),true)} · Week 12：${fd(ws(12),true)}–${fd(add(ws(12),6),true)}`:'未设置开始日期。'}
function ex(card,day,name,rx,id,calc=''){let done=load(id+'_d')==='1',row=document.createElement('div');row.className='exercise'+(done?' done':'');row.innerHTML=`<input type="checkbox" ${done?'checked':''}><div><div class="name">${name}</div><div class="rx">${rx}</div>${calc?`<div class="small">${calc}</div>`:''}<div class="fields"><input placeholder="实际重量/完成情况" value="${load(id+'_a')}"><input placeholder="RPE" value="${load(id+'_r')}"><input placeholder="备注" value="${load(id+'_n')}"></div></div>`;let q=row.querySelectorAll('input');q[0].onchange=e=>{save(id+'_d',e.target.checked?'1':'0');render()};q[1].oninput=e=>save(id+'_a',e.target.value);q[2].oninput=e=>save(id+'_r',e.target.value);q[3].oninput=e=>save(id+'_n',e.target.value);card.appendChild(row);return done}
function choice(card,day,w,kind,opts){let k=`wl_${w}_${day}_${kind}`,v=load(k)||Object.keys(opts)[0],box=document.createElement('div');box.className='choice';box.innerHTML=`<label>${kind==='main'?'今天主项':'今天拉'}</label><select>${Object.entries(opts).map(([x,n])=>`<option value="${x}" ${x===v?'selected':''}>${n}</option>`).join('')}</select>`;box.querySelector('select').onchange=e=>{save(k,e.target.value);render()};card.appendChild(box);return v}
function render(){summary();$('tabs').innerHTML='';P.forEach((_,i)=>{let b=document.createElement('button');b.className=i+1===week?'active':'';b.innerHTML=`W${i+1}${wr(i+1)?`<span class="tabdate">${wr(i+1)}</span>`:''}`;b.onclick=()=>{week=i+1;save('wl_current_week',week);render()};$('tabs').appendChild(b)});let p=P[week-1];$('weekTitle').textContent=`Week ${week}${wr(week)?' · '+wr(week):''}`;$('phase').textContent='阶段：'+p[0];$('content').innerHTML='';let total=0,done=0,days=['周一','周二','周四','周五'];days.forEach(day=>{let c=document.createElement('div');c.className='card';c.innerHTML=`<h3>${day}${td(week,day)?`<span class="daydate">${fd(td(week,day),true)}</span>`:''}</h3>`;if(day==='周一'){c.innerHTML+='<span class="tag">主项</span>';let a=p[1];[['Back Squat',scale(a[0],'bs')+' kg · '+a[1]],['Front Squat',scale(a[2],'fs')+' kg · '+a[3]]].forEach((x,i)=>{total++;done+=ex(c,day,x[0],x[1],`wl_${week}_${day}_m${i}`)});c.innerHTML+='<span class="tag">辅助</span>';[['Heavy Walkout / 预蹲',week===4||week===8?'可省略':'1–2组，重重量支撑'],['Back Extension / 山羊挺身',week===4||week===8?'2组轻量':'3组']].forEach((x,i)=>{total++;done+=ex(c,day,x[0],x[1],`wl_${week}_${day}_a${i}`)})}else if(day==='周五'){c.innerHTML+='<span class="tag">主项</span>';let a=p[2];[['Front Squat',scale(a[0],'fs')+' kg · '+a[1]],['Paused Back Squat',scale(a[2],'bs')+' kg · '+a[3]]].forEach((x,i)=>{total++;done+=ex(c,day,x[0],x[1],`wl_${week}_${day}_m${i}`)});c.innerHTML+='<span class="tag">辅助</span>';[['Pull-up / 引体向上',week===4||week===8?'2组轻量':'3组'],['Rear Delt Fly / 飞鸟',week===4||week===8?'2组轻量':'3组']].forEach((x,i)=>{total++;done+=ex(c,day,x[0],x[1],`wl_${week}_${day}_a${i}`)})}else{c.innerHTML+='<span class="tag">主项二选一</span>';let mc=choice(c,day,week,'main',{sn:'抓举 Snatch',cj:'挺举 Clean & Jerk'}),rx=(day==='周二'?p[3]:p[4])[mc==='sn'?0:1];total++;done+=ex(c,day,mc==='sn'?'Snatch':'Clean & Jerk',rx,`wl_${week}_${day}_mainEx`,calcPct(rx,mc));c.innerHTML+='<span class="tag">拉二选一</span>';let pc=choice(c,day,week,'pull',{wide:'宽拉 Snatch Pull',narrow:'窄拉 Clean Pull'});total++;done+=ex(c,day,pc==='wide'?'Wide Pull / 宽拉':'Narrow Pull / 窄拉',week===4||week===8?'2组轻量':'3组',`wl_${week}_${day}_pullEx`);c.innerHTML+='<span class="tag">辅助</span>';let as=day==='周二'?['Barbell Row / 杠铃划船','3组']:['Dips / 双杠臂屈伸','3组'];total++;done+=ex(c,day,as[0],week===4||week===8?'2组轻量':as[1],`wl_${week}_${day}_assist`)}$('content').appendChild(c)});let pc=total?Math.round(done/total*100):0;$('pct').textContent=`${done}/${total} · ${pc}%`;$('bar').style.width=pc+'%'}
$('applyMax').onclick=()=>{let n={bs:+$('bs').value,fs:+$('fs').value,sn:+$('sn').value||0,cj:+$('cj').value||0};if(!n.bs||!n.fs)return alert('请填写 Back Squat 和 Front Squat Max');max=n;Object.keys(n).forEach(k=>save('wl_max_'+k,n[k]));render()};$('defaults').onclick=()=>{max={bs:112,fs:100,sn:0,cj:0};Object.keys(max).forEach(k=>save('wl_max_'+k,max[k]));init()};$('applyDate').onclick=()=>{if(!date($('start').value))return alert('请选择有效日期');start=$('start').value;save('wl_program_start',start);render()};$('home').onclick=()=>scrollTo({top:0,behavior:'smooth'});$('reset').onclick=()=>{if(!confirm(`重置 Week ${week}？`))return;Object.keys(localStorage).filter(k=>k.startsWith(`wl_${week}_`)).forEach(k=>localStorage.removeItem(k));render()};$('export').onclick=()=>{let t=`12周举重训练记录\nWeek 1：${start||'未设置'}\n`;for(let i=1;i<=12;i++)t+=`W${i} ${wr(i)}\n`;let a=document.createElement('a');a.href=URL.createObjectURL(new Blob([t],{type:'text/plain;charset=utf-8'}));a.download='训练记录.txt';a.click()};init();
</script></body></html>
